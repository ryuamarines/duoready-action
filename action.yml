name: "DuoReady iPhone Duo compatibility preflight"
description: "Scan Swift sources for a bounded set of iPhone Duo compatibility review patterns and write a Markdown report."
author: "AI Factory"
branding:
  icon: "smartphone"
  color: "gray-dark"
inputs:
  path:
    description: "Directory containing the Swift project sources to scan."
    required: false
    default: "."
  output:
    description: "Markdown report path, relative to the workspace unless absolute."
    required: false
    default: "duoready-report.md"
  fail-on-high:
    description: "Fail the Action when one or more HIGH findings are present."
    required: false
    default: "false"
outputs:
  report:
    description: "Absolute path to the generated Markdown report."
  findings:
    description: "Total number of findings."
  high:
    description: "HIGH severity finding count."
  medium:
    description: "MEDIUM severity finding count."
  low:
    description: "LOW severity finding count."
runs:
  using: "node20"
  main: "action/index.mjs"
